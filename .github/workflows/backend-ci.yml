name: Backend CI

on:
  push:
    branches: [main, feature/backend]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 25 verification and contract quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify build and tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python chatbot regression
        working-directory: chatbot
        run: python -m unittest discover
      - name: Frontend regression
        run: node --test tools/test_frontend.cjs
      - name: Dependency advisory gate
        run: |
          ./mvnw --batch-mode --no-transfer-progress dependency:list -DoutputFile=target/dependencies.txt
          python tools/check_dependencies.py
      - name: Documentation consistency
        run: |
          python -m pip install -r tools/requirements-docs.txt
          python tools/validate_docs.py
      - name: Check Java release and package layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          pom = ET.parse("pom.xml").getroot()
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          properties = pom.find("m:properties", ns)
          assert properties is not None
          assert properties.findtext("m:java.version", namespaces=ns) == "25"
          assert properties.findtext("m:maven.compiler.release", namespaces=ns) == "25"
          for root in (Path("src/main/java"), Path("src/test/java")):
              for source in root.rglob("*.java"):
                  expected = ".".join(source.relative_to(root).with_suffix("").parts[:-1])
                  package = next(
                      (line[8:-1] for line in source.read_text(encoding="utf-8").splitlines()
                       if line.startswith("package ") and line.endswith(";")),
                      None,
                  )
                  if package != expected:
                      raise SystemExit(f"{source}: expected package {expected}, found {package}")
          print("Java release and package layout valid")
          PY
      - name: Validate OpenAPI document
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          spec = yaml.safe_load(Path("api/openapi.yaml").read_text(encoding="utf-8"))
          operations = [
              operation
              for path in spec["paths"].values()
              for method, operation in path.items()
              if method.lower() in {"get", "post", "put", "patch", "delete"}
          ]
          if not operations:
              raise SystemExit("OpenAPI has no operations")
          missing = [
              operation.get("summary", "<unnamed>")
              for operation in operations
              if operation.get("x-implementation-status") not in {"implemented", "designed"}
              or not operation.get("x-required-role")
          ]
          if missing:
              raise SystemExit(f"Operations missing implementation status or role: {missing}")
          print(f"OpenAPI valid: {len(operations)} operations have status and role")
          PY

  postgres-integration:
    name: Java 25 and PostgreSQL baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fornitori
          POSTGRES_USER: fornitori_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fornitori_app -d fornitori"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fornitori
      SPRING_DATASOURCE_USERNAME: fornitori_app
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply schema, seed, and baseline assertions
        env:
          PGPASSWORD: ci-only-password
        run: |
          for script in database/*.sql; do
            psql --host localhost --username fornitori_app --dbname fornitori --set ON_ERROR_STOP=1 --file "$script"
          done
      - name: Verify application and tests against PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Browser tools
        run: |
          python -m pip install -r tools/requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Browser to committed PostgreSQL flow
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: fornitori_app
          PGPASSWORD: ci-only-password
          PGDATABASE: fornitori_e2e
          E2E_ISOLATED: '1'
          E2E_BASE_URL: http://127.0.0.1:58880
          E2E_OUTPUT: target/e2e
        run: |
          createdb fornitori_e2e
          for script in database/*.sql; do
            psql --set ON_ERROR_STOP=1 --file "$script" > /dev/null
          done
          export E2E_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$E2E_PASSWORD"
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(autocommit=True) as db:
              db.execute('CREATE EXTENSION IF NOT EXISTS pgcrypto')
              db.execute("UPDATE app_users SET password_hash=crypt(%s, gen_salt('bf', 10))", (os.environ['E2E_PASSWORD'],))
          PY
          export SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/fornitori_e2e
          export SERVER_ADDRESS=127.0.0.1 SERVER_PORT=58880 DEBUG=false
          java -jar target/fornitori-0.0.1-SNAPSHOT.jar > target/e2e-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:58880/api/v1/auth/csrf > /dev/null; then break; fi
            sleep 1
          done
          python tools/browser_e2e.py
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: |
            target/surefire-reports/*.xml
            target/e2e/*.png
          retention-days: 7
