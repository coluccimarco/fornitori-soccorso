<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Carro attrezzi con una piccola utilitaria blu sul pianale</title>
  <desc id="d">Illustrazione: un carro attrezzi giallo percorre una strada della campagna trasportando sul pianale una piccola utilitaria blu a tre porte dei primi anni Duemila.</desc>
