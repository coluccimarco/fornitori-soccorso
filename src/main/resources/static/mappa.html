<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FORNITORI - Mappa missione</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { font-family: system-ui, sans-serif; color: #1f2933; background: #f4f5f7; }
    body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #d9dde3; }
    h1 { font-size: 18px; margin: 0; }
    main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
    form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; flex: 1 1 220px; }
    input, select, button { font: inherit; padding: 8px 10px; border: 1px solid #b8bfc9; border-radius: 6px; background: #fff; max-width: 100%; }
    button { cursor: pointer; flex: 0 0 auto; background: #1f5fbf; border-color: #1f5fbf; color: #fff; }
    button.secondary { background: #fff; color: #1f2933; border-color: #b8bfc9; }
    #map { flex: 1; min-height: 420px; border-radius: 8px; border: 1px solid #d9dde3; }
    #message { min-height: 20px; margin: 0; font-size: 14px; }
    #message.error { color: #b42318; }
    #summary { margin: 0; padding-left: 20px; font-size: 14px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Mappa missione</h1>
    <button id="logout" class="secondary" type="button" hidden>Esci</button>
  </header>
  <main>
    <form id="login-form" hidden>
      <label>Email <input id="email" type="email" autocomplete="username" required></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Accedi</button>
    </form>
    <form id="route-form" hidden>
      <label>Missione <select id="mission" required></select></label>
      <label id="driver-field">Autista <select id="driver"></select></label>
      <button type="submit">Mostra percorso</button>
    </form>
    <p id="message" role="status"></p>
    <ol id="summary" hidden></ol>
    <div id="map" hidden></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const API = "/api/v1";
    const POINT_LABELS = { base: "Base operativa", sinistro: "Luogo del sinistro", officina: "Officina" };
    const ROUTE_ERRORS = {
      400: "Scegli un autista per calcolare il percorso.",
      403: "Non puoi vedere questa missione.",
      404: "Missione non trovata.",
      422: "Indirizzo non trovato: correggilo o usa la posizione condivisa.",
      503: "Servizio mappe non disponibile: riprova. I km si possono comunque inserire alla chiusura.",
    };
    const $ = (id) => document.getElementById(id);
    let map = null;
    let layers = [];

    function showMessage(text, isError = false) {
      $("message").textContent = text;
      $("message").classList.toggle("error", isError);
    }

    async function send(method, path, body) {
      const headers = { Accept: "application/json" };
      if (method !== "GET") {
        const csrf = await (await fetch(`${API}/auth/csrf`)).json();
        headers[csrf.headerName] = csrf.token;
      }
      if (body) {
        headers["Content-Type"] = "application/json";
      }
      return fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    }

    async function getJson(path) {
      const response = await send("GET", path);
      if (!response.ok) {
        throw new Error(`Errore ${response.status}`);
      }
      return response.json();
    }

    function addOption(select, value, text) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = text;
      select.append(option);
    }

    async function showRouteForm(user) {
      const isDriver = user.ruolo === "autista";
      const missions = await getJson(isDriver ? "/autista/missioni" : "/missioni");
      $("mission").replaceChildren();
      missions.forEach((m) => addOption($("mission"), m.id, `${m.codice} - ${m.origineIndirizzo} (${m.stato})`));
      $("driver-field").hidden = isDriver;
      if (!isDriver) {
        const drivers = await getJson("/autisti");
        $("driver").replaceChildren();
        addOption($("driver"), "", "Autista assegnato");
        drivers.forEach((d) => addOption($("driver"), d.id, `${d.nome} (${d.disponibilita})`));
      }
      const preselected = new URLSearchParams(location.search).get("missione");
      if (preselected) {
        $("mission").value = preselected;
      }
      $("login-form").hidden = true;
      $("route-form").hidden = false;
      $("logout").hidden = false;
      showMessage(missions.length ? "" : "Nessuna missione da mostrare.");
    }

    function drawRoute(route) {
      $("map").hidden = false;
      if (!map) {
        map = L.map("map");
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        }).addTo(map);
      }
      map.invalidateSize();
      layers.forEach((layer) => layer.remove());
      const line = L.geoJSON(route.geometria, { style: { color: "#1f5fbf", weight: 5 } }).addTo(map);
      layers = [line];
      $("summary").replaceChildren();
      route.punti.forEach((point) => {
        const label = `${POINT_LABELS[point.tipo] || point.tipo}: ${point.descrizione}`;
        const popup = document.createElement("span");
        popup.textContent = label;
        layers.push(L.marker([point.lat, point.lng]).addTo(map).bindPopup(popup));
        const item = document.createElement("li");
        item.textContent = label;
        $("summary").append(item);
      });
      $("summary").hidden = false;
      map.fitBounds(line.getBounds(), { padding: [24, 24] });
      showMessage(`Km stimati: ${route.kmStimati} (fonte: OSRM). I km effettivi si confermano alla chiusura.`);
    }

    $("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await send("POST", "/auth/login", { email: $("email").value, password: $("password").value });
      $("password").value = "";
      if (!response.ok) {
        showMessage("Credenziali non valide.", true);
        return;
      }
      await start();
    });

    $("route-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("Calcolo del percorso...");
      const params = new URLSearchParams({ missionId: $("mission").value });
      if (!$("driver-field").hidden && $("driver").value) {
        params.set("driverId", $("driver").value);
      }
      try {
        const response = await send("GET", `/maps/route?${params}`);
        if (!response.ok) {
          showMessage(ROUTE_ERRORS[response.status] || `Errore ${response.status}`, true);
          return;
        }
        drawRoute(await response.json());
      } catch (error) {
        showMessage("Server non raggiungibile.", true);
      }
    });

    $("logout").addEventListener("click", async () => {
      await send("POST", "/auth/logout");
      location.reload();
    });

    async function start() {
      try {
        const response = await send("GET", "/auth/me");
        if (response.ok) {
          await showRouteForm(await response.json());
        } else {
          $("login-form").hidden = false;
        }
      } catch (error) {
        showMessage("Server non raggiungibile.", true);
      }
    }

    start();
  </script>
</body>
</html>
