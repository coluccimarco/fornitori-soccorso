openapi: 3.0.3
info:
  title: FORNITORI REST API
  version: 1.0.0
  description: >
    Contratto condiviso per FORNITORI. Il corpo delle richieste ha un limite di 64 KiB (413) e deve dichiarare la lunghezza (411). Auth, anagrafiche, missioni, dashboard,
    chatbot e API di geocodifica/percorso sono implementati; gestione utenti e
    webhook in ingresso sono fuori ambito (status designed). Lo stato di ogni operation
    è indicato da x-implementation-status.
servers:
  - url: /
tags:
  - name: Auth
  - name: Utenti
  - name: Anagrafiche
  - name: Missioni
  - name: Dashboard
  - name: Autisti
  - name: Mappe
  - name: Integrazioni
  - name: Chat
security:
  - sessionCookie: []
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Autenticazione email/password (cookie sessione HttpOnly)
      description: Login JSON. Richiede il token di GET /api/v1/auth/csrf nell'header indicato.
      x-implementation-status: implemented
      x-required-role: PUBLIC
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {email: "responsabile@demo.it", password: "<password demo>"}
      responses:
        '200': {description: Sessione autenticata, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Identità e ruolo della sessione
      x-implementation-status: implemented
      x-required-role: AUTHENTICATED
      responses:
        '200': {description: Utente autenticato, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoca sessione
      description: Richiede autenticazione e token CSRF.
      x-implementation-status: implemented
      x-required-role: AUTHENTICATED
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': {description: Sessione invalidata}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      summary: Token CSRF per richieste mutative
      description: Endpoint pubblico; crea o recupera il token associato alla sessione.
      x-implementation-status: implemented
      x-required-role: PUBLIC
      security: []
      responses: {'200': {description: Token CSRF, content: {application/json: {schema: {type: object, properties: {token: {type: string}, headerName: {type: string}}}}}}}
  /api/v1/autisti:
    get:
      tags: [Anagrafiche]
      summary: Elenco autisti e disponibilità operativa derivata dalle missioni LIVE
      description: Solo RESPONSABILE. L'occupazione dipende dalle missioni non fixture, non dallo stato seed.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      responses:
        '200': {description: Autisti, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Driver'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/mezzi:
    get:
      tags: [Anagrafiche]
      summary: Mezzi e coordinate basi
      description: Solo RESPONSABILE.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      responses:
        '200': {description: Mezzi, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Vehicle'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/compagnie:
    get:
      tags: [Anagrafiche]
      summary: Compagnie assicurative
      description: Solo RESPONSABILE.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      responses:
        '200': {description: Compagnie, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Company'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/officine:
    get:
      tags: [Anagrafiche]
      summary: Officine e coordinate
      description: Solo RESPONSABILE.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      responses:
        '200': {description: Officine, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Workshop'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/clienti:
    get:
      tags: [Anagrafiche]
      summary: Ricerca cliente per nome/targa
      description: Solo RESPONSABILE. Ricerca case-insensitive per nome e normalizzata per targa.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      parameters:
        - {name: search, in: query, schema: {type: string}}
      responses:
        '200': {description: Clienti, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Customer'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Anagrafiche]
      summary: Inserisci nuovo cliente (solo centrale)
      description: Richiede ruolo RESPONSABILE e token CSRF.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCustomer'}
      responses:
        '201': {description: Cliente creato, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/utenti:
    get:
      tags: [Utenti]
      summary: Elenco profili utente senza credenziali
      description: Gestione utenti fuori ambito della consegna; operazione non esposta dal backend.
      x-implementation-status: designed
      x-required-role: RESPONSABILE
      responses:
        '200': {description: Profili utente, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/UserSummary'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/utenti/{id}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      tags: [Utenti]
      summary: Dettaglio profilo utente senza credenziali
      description: Gestione utenti fuori ambito della consegna; operazione non esposta dal backend.
      x-implementation-status: designed
      x-required-role: RESPONSABILE
      responses:
        '200': {description: Profilo, content: {application/json: {schema: {$ref: '#/components/schemas/UserSummary'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/missioni:
    get:
      tags: [Missioni]
      summary: Missioni per stato e modalità riferimento/live
      description: RESPONSABILE consulta live per default; mode reference include solo fixture storiche.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      parameters:
        - {name: stato, in: query, schema: {type: string}}
        - {name: mode, in: query, schema: {type: string, enum: [reference, live], default: live}}
      responses:
        '200': {description: Elenco missioni, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Mission'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Missioni]
      summary: Crea missione nuova da centrale
      description: Crea una missione live in stato nuova. Coordinate devono essere entrambe valorizzate o assenti; traino richiede officina.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMission'}
            example:
              clienteId: 1
              tipoIntervento: traino
              descrizioneProblema: "Veicolo in panne"
              origineIndirizzo: "Via Roma 10, Molfetta"
              origineLat: 41.2003
              origineLng: 16.5978
              officinaId: 1
              canaleOrigine: centrale
      responses:
        '201': {description: Missione creata, content: {application/json: {schema: {$ref: '#/components/schemas/Mission'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/missioni/{id}:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    get:
      tags: [Missioni]
      summary: Dettaglio missione secondo ruolo
      description: RESPONSABILE può consultare tutte le missioni; AUTISTA solo missioni live attualmente assegnate o eseguite dal medesimo autista; una proposta passata non autorizza accesso dopo riassegnazione.
      x-implementation-status: implemented
      x-required-role: [RESPONSABILE, ASSIGNED_AUTISTA]
      responses:
        '200': {description: Dettaglio missione, content: {application/json: {schema: {$ref: '#/components/schemas/Mission'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/missioni/{id}/proposta-automatica:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    post:
      tags: [Missioni]
      summary: Propone la missione all'autista libero con la base più vicina
      description: Distanza in linea d'aria tra il luogo del sinistro e la base del mezzo. Esclude gli autisti con una missione attiva e quelli che hanno già risposto a questa missione. Se mancano le coordinate converte l'indirizzo con Nominatim. 409 se nessuno è libero, 422 se l'indirizzo non si trova, 503 se il servizio non risponde.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': {description: Proposta inviata, content: {application/json: {schema: {$ref: '#/components/schemas/NearestProposal'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: Indirizzo non trovato}
        '503': {description: Servizio di geocodifica non disponibile}
  /api/v1/centrale/avvisi:
    get:
      tags: [Missioni]
      summary: Notifiche per la centrale
      description: Prima le richieste di supporto aperte, dalla più vecchia; poi fino a 50 eventi recenti di proposte rifiutate o scadute su missioni live, dal più recente. Non c'è stato di lettura sul server.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
      responses:
        '200': {description: Avvisi, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CentreAlert'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/missioni/{id}/intervento:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    patch:
      tags: [Missioni]
      summary: Corregge tipo di intervento e officina prima della proposta
      description: Consentito per missioni nuove, non accettate o scadute. Serve anche a impostare il traino sulle missioni create dal chatbot.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateIntervention'}
      responses:
        '200': {description: Missione aggiornata, content: {application/json: {schema: {$ref: '#/components/schemas/Mission'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/missioni/{id}/proposte:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    get:
      tags: [Missioni]
      summary: Storico delle proposte di una missione
      description: Sola lettura, dalla prima alla più recente, anche per le missioni dello storico di riferimento.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
      responses:
        '200': {description: Storico proposte, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProposalHistoryEntry'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Missioni]
      summary: Proponi o riproponi la missione a un autista libero (centrale)
      description: Il backend blocca missione e autista; timeout letto da pricing_config. I record storici delle proposte non vengono eliminati.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProposeMission'}
            example: {autistaId: 2}
      responses:
        '200': {description: Proposta inviata, content: {application/json: {schema: {type: object, properties: {stato: {type: string, example: proposta}, scadenzaIl: {type: string, format: date-time}, offertaId: {type: integer}}}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/missioni/{id}/accept:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    post:
      tags: [Autisti]
      summary: Accetta proposta corrente (solo autista destinatario)
      description: L'identità viene ricavata dalla sessione. now deve essere strettamente precedente alla scadenza.
      x-implementation-status: implemented
      x-required-role: ASSIGNED_AUTISTA
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': {description: Missione accettata, content: {application/json: {schema: {$ref: '#/components/schemas/Mission'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/missioni/{id}/reject:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    post:
      tags: [Autisti]
      summary: Rifiuta proposta corrente
      description: Solo il destinatario della proposta. La risposta rimane nello storico e la missione può essere riproposta. Alla deadline o dopo scade con risposta 409, anche prima dello scheduler.
      x-implementation-status: implemented
      x-required-role: ASSIGNED_AUTISTA
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': {description: Missione non accettata, content: {application/json: {schema: {$ref: '#/components/schemas/Mission'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/missioni/{id}/complete:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    post:
      tags: [Autisti]
      summary: Chiudi missione accettata con esito OK, km reali e costo calcolato
      description: Solo l'autista assegnato. Il prezzo viene calcolato dal backend usando il timestamp di accettazione in Europe/Rome.
      x-implementation-status: implemented
      x-required-role: ASSIGNED_AUTISTA
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompleteMission'}
            example: {kmEffettivi: 18}
      responses:
        '200': {description: Missione eseguita, content: {application/json: {schema: {$ref: '#/components/schemas/Mission'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/missioni/{id}/cost:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    patch:
      tags: [Missioni]
      summary: Rettifica motivata del costo (solo centrale)
      description: Per missioni eseguite o annullate dalla centrale con costo attribuito all'autista. Conserva costo calcolato e motivazione; registra l'attore e i valori precedenti nello storico eventi.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CostAdjustment'}
            example: {costoFinale: 80.00, motivo: "Correzione autorizzata dopo verifica"}
      responses:
        '200': {description: Nuovo importo e evento audit, content: {application/json: {schema: {$ref: '#/components/schemas/Mission'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/missioni/{id}/notes:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    get:
      tags: [Missioni]
      summary: Note della missione
      description: RESPONSABILE o AUTISTA attualmente assegnato alla missione live; accesso revocato dopo rifiuto o riassegnazione.
      x-implementation-status: implemented
      x-required-role: [RESPONSABILE, ASSIGNED_AUTISTA]
      responses:
        '200': {description: Elenco note, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/MissionNote'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Autisti]
      summary: Avviso o richiesta di supporto sulla missione
      description: RESPONSABILE o AUTISTA attualmente assegnato alla missione live; accesso revocato dopo rifiuto o riassegnazione. tipo SUPPORTO solo dall'autista assegnato su missione accettata.
      x-implementation-status: implemented
      x-required-role: [RESPONSABILE, ASSIGNED_AUTISTA]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMissionNote'}
            example: {testo: "Cliente non presente, attendo 10 minuti"}
      responses:
        '201': {description: Nota persistita, content: {application/json: {schema: {$ref: '#/components/schemas/MissionNote'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/missioni/{id}/notes/{noteId}/gestita:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
      - {name: noteId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      tags: [Missioni]
      summary: Chiude una richiesta di supporto
      description: Ripetere la chiamata non cambia chi l'ha gestita né quando. 409 se la nota non è di tipo SUPPORTO.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': {description: Nota aggiornata, content: {application/json: {schema: {$ref: '#/components/schemas/MissionNote'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/missioni/{id}/annulla:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    post:
      tags: [Missioni]
      summary: Annulla la missione
      description: "Autista: solo la propria missione accettata, compenso 0 e missione che resta nel suo storico. Responsabile: ogni stato non finale; se l'autista aveva accettato, il costo sui km stimati totali gli viene attribuito ed è rettificabile; prima dell'accettazione costo 0 e nessun autista. 409 se già eseguita o annullata."
      x-implementation-status: implemented
      x-required-role: [RESPONSABILE, ASSIGNED_AUTISTA]
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelMission'}
      responses:
        '200': {description: Missione annullata, content: {application/json: {schema: {$ref: '#/components/schemas/Mission'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/missioni/{id}/verifica-polizza:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    post:
      tags: [Missioni]
      summary: Esito della verifica polizza
      description: Solo da verifica_polizza. CONFERMATA richiede clienteId di un cliente con polizza attiva (400 se manca o non esiste, 409 se la polizza non è attiva) e riporta la missione a nuova con assegnazione automatica. RESPINTA annulla la missione a costo zero, senza autista.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyVerification'}
      responses:
        '200': {description: Missione aggiornata, content: {application/json: {schema: {$ref: '#/components/schemas/Mission'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/autista/disponibilita:
    patch:
      tags: [Autisti]
      summary: L'autista si dichiara disponibile o no
      description: Un autista non disponibile non riceve proposte, né automatiche né manuali. La missione in corso non cambia.
      x-implementation-status: implemented
      x-required-role: AUTISTA
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DriverAvailabilityRequest'}
      responses:
        '200': {description: Disponibilità salvata, content: {application/json: {schema: {$ref: '#/components/schemas/DriverAvailability'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard operativa, categorie, coda critica e costi
      description: reference restituisce la baseline fixture Excel; live esclude tutte le fixture. totaleEur e totalePerAutista includono gli annullamenti con costo attribuito. Il pending storico conta nuova, proposta e accettata; categorie.pending solo proposta e accettata.
      x-implementation-status: implemented
      x-required-role: RESPONSABILE
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [reference, live], default: live}}
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
              example:
                eseguite: 16
                pending: 6
                scadute: 4
                nonAccettate: 4
                totaleEur: 1509.71
                riferimentoAl: "2026-10-28"
                fonte: "excel_demo"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/autista/missioni:
    get:
      tags: [Autisti]
      summary: Missioni aperte del solo autista autenticato
      description: Restituisce proposte e missioni accettate live assegnate al principal.
      x-implementation-status: implemented
      x-required-role: AUTISTA
      responses:
        '200': {description: Missioni dell'autista, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Mission'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/autista/missioni/{id}:
    parameters:
      - {$ref: '#/components/parameters/MissionId'}
    get:
      tags: [Autisti]
      summary: Dettaglio di una missione proposta o accettata all'autista autenticato
      description: Aggiunge cliente, contatti e officina. Nome, cognome e telefono del cliente e telefono sul posto sono visibili già dalla proposta; la targa è null finché la missione non è accettata. guadagnoStimato è null finché non è stato calcolato il percorso. Chiusa la missione risponde 409.
      x-implementation-status: implemented
      x-required-role: ASSIGNED_AUTISTA
      responses:
        '200': {description: Dettaglio missione, content: {application/json: {schema: {$ref: '#/components/schemas/DriverMissionDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/autista/storico:
    get:
      tags: [Autisti]
      summary: Missioni eseguite e guadagno del solo autista autenticato
      description: Include solo missioni live eseguite dall'autista corrente.
      x-implementation-status: implemented
      x-required-role: AUTISTA
      responses:
        '200': {description: Storico e totale, content: {application/json: {schema: {$ref: '#/components/schemas/DriverHistory'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/maps/route:
    get:
      tags: [Mappe]
      summary: Calcola base → sinistro → officina, se traino; solo base → sinistro se riparazione
      description: Se la missione ha solo l'indirizzo, lo converte in coordinate con Nominatim e le salva. Richiede X-CSRF-TOKEN anche su GET e HEAD implicito per gli effetti di persistenza legacy. Salva i km stimati finché la missione non è eseguita e solo per l'autista assegnato, se presente. L'AUTISTA usa sempre il proprio mezzo; il RESPONSABILE sceglie driverId, altrimenti vale l'autista assegnato.
      x-implementation-status: implemented
      x-required-role: [RESPONSABILE, ASSIGNED_AUTISTA]
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - {name: missionId, in: query, required: true, schema: {type: integer, format: int64}}
        - {name: driverId, in: query, required: false, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: Routing suggerito, non chilometri effettivi
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Route'}
              example: {kmStimati: 18.4, origine: osrm, autistaId: 1, punti: [{tipo: base, descrizione: "Via Terlizzi 88, Molfetta", lat: 41.2003, lng: 16.5978}, {tipo: sinistro, descrizione: "Via Roma 10, Molfetta", lat: 41.205, lng: 16.605}], geometria: {type: LineString, coordinates: [[16.5978,41.2003],[16.601,41.202],[16.605,41.205]]}}
        '422': {description: Indirizzo non trovato dal servizio di geocodifica}
        '503': {description: Servizio esterno non disponibile; client può correggere km effettivi}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/chat/lookup-targa:
    post:
      tags: [Chat]
      summary: Riconosce il cliente dalla targa
      description: Risponde con nome e compagnia se la targa è di un cliente con polizza valida, come previsto dai dialoghi del docente. Altrimenti verificato è false. Dopo 5 targhe non trovate nella stessa sessione in 15 minuti, o 10 ricerche al minuto, risponde 429.
      x-implementation-status: implemented
      x-required-role: SERVICE_CHATBOT
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatVehicleLookup'}
      responses:
        '200': {description: Esito del riconoscimento, content: {application/json: {schema: {$ref: '#/components/schemas/ChatVehicleLookupResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {description: Limite richieste superato}
  /api/v1/chat/missioni:
    post:
      tags: [Chat]
      summary: Crea richiesta missione da conversazione
      description: Lo stesso requestId restituisce la missione già creata. Senza clienteId la missione nasce in verifica_polizza. Con tipoProblema il tipo di intervento e la descrizione li decide il backend. Per il traino senza officinaId il backend assegna l'officina più vicina in linea d'aria e, se mancano le coordinate, converte l'indirizzo con Nominatim e le salva. Risponde 422 se l'indirizzo non si trova, 503 se il servizio non risponde.
      x-implementation-status: implemented
      x-required-role: SERVICE_CHATBOT
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatMissionRequest'}
      responses:
        '201': {description: Missione creata o già esistente per requestId, content: {application/json: {schema: {$ref: '#/components/schemas/ChatMissionCreated'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/chat/stato:
    post:
      tags: [Chat]
      summary: Stato dell'ultima richiesta aperta della chat
      description: Cerca per canale e chat, non per id missione. Una missione eseguita non è più aperta e risponde 404. autistaNome è sempre null, il cliente non riceve il nome dell'autista. Usa POST per non scrivere l'id della chat nell'URL.
      x-implementation-status: implemented
      x-required-role: SERVICE_CHATBOT
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatStatusRequest'}
      responses:
        '200': {description: Stato della richiesta, content: {application/json: {schema: {$ref: '#/components/schemas/MissionStatus'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Nessuna richiesta aperta per questa chat}
  /api/v1/chat/notifiche/claim:
    post:
      tags: [Chat]
      summary: Riserva le notifiche da inviare al cliente
      description: Porta in modo atomico fino a 20 messaggi del canale da PENDING a SENDING e li restituisce, così due dispatcher non ricevono la stessa riga. Una riserva senza esito scade dopo 5 minuti, conta come tentativo e la riga torna disponibile.
      x-implementation-status: implemented
      x-required-role: SERVICE_CHATBOT
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatNotificationClaim'}
      responses:
        '200': {description: Notifiche da inviare, content: {application/json: {schema: {$ref: '#/components/schemas/ChatNotifications'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/chat/notifiche/{id}/esito:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      tags: [Chat]
      summary: Registra l'esito dell'invio di una notifica
      description: Un invio fallito torna disponibile dopo 30 secondi; dopo 5 tentativi la notifica passa a FAILED. Vale solo per la riserva in corso; una notifica già chiusa o un tentativo non più attuale vengono ignorati.
      x-implementation-status: implemented
      x-required-role: SERVICE_CHATBOT
      security:
        - serviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatNotificationResult'}
      responses:
        '204': {description: Esito registrato}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/webhooks/telegram:
    post:
      tags: [Integrazioni]
      summary: Ingresso pubblico Telegram (secret header validato)
      description: Webhook fuori ambito della consegna; operazione non esposta dal backend.
      x-implementation-status: designed
      x-required-role: TELEGRAM_WEBHOOK_SIGNATURE
      security: []
      parameters:
        - {name: X-Telegram-Bot-Api-Secret-Token, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderWebhookPayload'}}}}
      responses:
        '200': {description: Update ricevuto; elaborazione idempotente}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: Limite richieste superato}
  /api/v1/webhooks/whatsapp:
    post:
      tags: [Integrazioni]
      summary: Ingresso gateway WhatsApp/Twilio, firma provider validata
      description: Webhook fuori ambito della consegna; operazione non esposta dal backend.
      x-implementation-status: designed
      x-required-role: WHATSAPP_PROVIDER_SIGNATURE
      security: []
      parameters:
        - {name: X-Twilio-Signature, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderWebhookPayload'}}}}
      responses:
        '200': {description: Evento verificato e idempotente}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: Limite richieste superato}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    MissionId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64}
    UserId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64}
  responses:
    Unauthorized: {description: Autenticazione richiesta, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    Forbidden: {description: Operazione non autorizzata, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    Conflict: {description: Stato missione, disponibilità o duplicato in conflitto, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    BadRequest: {description: Input non valido, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    NotFound: {description: Risorsa non trovata o non accessibile, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 200}
        password: {type: string, minLength: 1, maxLength: 128}
    CurrentUser:
      type: object
      properties:
        id: {type: integer, format: int64}
        nome: {type: string}
        email: {type: string}
        ruolo:
          type: string
          enum: [responsabile, autista]
        autistaId: {type: integer, format: int64, nullable: true}
        disponibile: {type: boolean, nullable: true, description: Solo per gli autisti}
    UserSummary:
      type: object
      properties:
        id: {type: integer, format: int64}
        nome: {type: string}
        email: {type: string, format: email}
        ruolo:
          type: string
          enum: [responsabile, autista]
        autistaId: {type: integer, format: int64, nullable: true}
    Customer:
      type: object
      properties:
        id: {type: integer, format: int64}
        nome: {type: string}
        cognome: {type: string, nullable: true}
        telefono: {type: string}
        targa: {type: string}
        modelloVeicolo: {type: string, nullable: true}
        compagniaId: {type: integer, format: int64}
        compagniaNome: {type: string}
        numeroPolizza: {type: string}
        scadenzaPolizza: {type: string, format: date}
        cittaResidenza: {type: string, nullable: true}
    Driver:
      type: object
      properties:
        id: {type: integer, format: int64}
        nome: {type: string}
        telefono: {type: string}
        mezzoId: {type: integer, format: int64}
        zona: {type: string}
        disponibilita:
          type: string
          enum: [disponibile, occupato, non_disponibile]
    Vehicle:
      type: object
      properties:
        id: {type: integer, format: int64}
        targa: {type: string}
        tipologia: {type: string}
        portataT: {type: number}
        baseIndirizzo: {type: string}
        baseCitta: {type: string}
        baseLat: {type: number}
        baseLng: {type: number}
    Company:
      type: object
      properties:
        id: {type: integer, format: int64}
        nome: {type: string}
        telefonoCentrale: {type: string, nullable: true}
        emailSinistri: {type: string, nullable: true}
    Workshop:
      type: object
      properties:
        id: {type: integer, format: int64}
        nome: {type: string}
        indirizzo: {type: string}
        citta: {type: string}
        lat: {type: number}
        lng: {type: number}
    CreateCustomer:
      type: object
      required: [nome, telefono, targa, compagniaId, numeroPolizza, scadenzaPolizza]
      properties:
        nome: {type: string, maxLength: 150, minLength: 1}
        cognome: {type: string, maxLength: 100}
        telefono: {type: string, maxLength: 32, minLength: 1}
        targa: {type: string, maxLength: 20, minLength: 1}
        modelloVeicolo: {type: string, maxLength: 150}
        compagniaId: {type: integer, format: int64, minimum: 1}
        numeroPolizza: {type: string, maxLength: 100, minLength: 1}
        scadenzaPolizza: {type: string, format: date}
        cittaResidenza: {type: string, maxLength: 150}
    CreateMission:
      description: Coordinate origine devono essere entrambe omesse o entrambe valorizzate; traino richiede officinaId.
      type: object
      required: [clienteId, tipoIntervento, descrizioneProblema, origineIndirizzo, canaleOrigine]
      properties:
        clienteId: {type: integer, format: int64, minimum: 1}
        tipoIntervento:
          type: string
          enum: &id001 [traino, riparazione_sul_posto]
        descrizioneProblema: {type: string, minLength: 1, maxLength: 2000}
        origineIndirizzo: {type: string, minLength: 1, maxLength: 500}
        origineLat: {type: number, minimum: -90, maximum: 90, nullable: true}
        origineLng: {type: number, minimum: -180, maximum: 180, nullable: true}
        officinaId: {type: integer, format: int64, nullable: true, minimum: 1}
        kmStimati: {type: number, minimum: 0, nullable: true, description: Distanza stimata dalla mappa, non utilizzata come distanza effettiva: null, maximum: 99999999.99,
          multipleOf: 0.01}
        canaleOrigine:
          type: string
          enum: [centrale, whatsapp, telegram]
    UpdateIntervention:
      description: Il traino richiede officinaId.
      type: object
      required: [tipoIntervento]
      properties:
        tipoIntervento:
          type: string
          enum: [traino, riparazione_sul_posto]
        officinaId: {type: integer, format: int64, minimum: 1, nullable: true}
    ChatMissionCreated:
      type: object
      properties:
        id: {type: integer, format: int64}
        codice: {type: string}
        stato:
          type: string
          enum: [nuova, proposta, accettata, eseguita, non_accettata, scaduta, verifica_polizza, gestione_manuale, annullata]
        inVerifica: {type: boolean, description: true se la missione è in verifica_polizza}
    ProposeMission:
      type: object
      required: [autistaId]
      properties:
        autistaId: {type: integer, format: int64, minimum: 1}
    CompleteMission:
      type: object
      required: [kmEffettivi]
      properties:
        kmEffettivi: {type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01}
      description: Precisione NUMERIC(10,2); anche il costo calcolato deve rientrare in 99999999.99 EUR, altrimenti 400 e nessuna chiusura.
    CostAdjustment:
      type: object
      required: [costoFinale, motivo]
      properties:
        costoFinale: {type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01}
        motivo: {type: string, minLength: 3, maxLength: 1000}
    CreateMissionNote:
      type: object
      required: [testo]
      properties:
        testo: {type: string, minLength: 1, maxLength: 2000}
        tipo: {type: string, enum: [AVVISO, SUPPORTO], default: AVVISO}
    CancelMission:
      type: object
      required: [motivo]
      properties:
        motivo: {type: string, minLength: 3, maxLength: 500}
    PolicyVerification:
      type: object
      required: [esito]
      properties:
        esito: {type: string, enum: [CONFERMATA, RESPINTA]}
        clienteId: {type: integer, format: int64, minimum: 1, nullable: true, description: Obbligatorio con CONFERMATA}
        note: {type: string, maxLength: 500, nullable: true}
    DriverAvailabilityRequest:
      type: object
      required: [disponibile]
      properties:
        disponibile: {type: boolean}
    DriverAvailability:
      type: object
      properties:
        disponibile: {type: boolean}
    MissionNote:
      type: object
      properties:
        id: {type: integer, format: int64}
        missionId: {type: integer, format: int64}
        userId: {type: integer, format: int64}
        autoreNome: {type: string, nullable: true, description: Nome dell'utente che ha scritto la nota}
        testo: {type: string}
        createdAt: {type: string, format: date-time}
        tipo: {type: string, enum: [AVVISO, SUPPORTO]}
        gestitaIl: {type: string, format: date-time, nullable: true}
        gestitaDa: {type: integer, format: int64, nullable: true}
    DriverHistory:
      type: object
      properties:
        missioni:
          type: array
          items: {$ref: '#/components/schemas/Mission'}
        totaleEur: {type: number, minimum: 0}
    MissionStatus:
      type: object
      properties:
        codice: {type: string}
        stato:
          type: string
          enum: [nuova, proposta, accettata, eseguita, non_accettata, scaduta, verifica_polizza, gestione_manuale, annullata]
        autistaNome: {type: string, nullable: true, description: Sempre null, il cliente non riceve il nome dell'autista}
        aggiornataIl: {type: string, format: date-time}
    ProposalHistoryEntry:
      type: object
      properties:
        id: {type: integer, format: int64}
        autistaId: {type: integer, format: int64}
        autistaNome: {type: string, nullable: true}
        stato: {type: string, enum: [proposta, accettata, non_accettata, scaduta, chiusa]}
        propostaIl: {type: string, format: date-time}
        scadenzaIl: {type: string, format: date-time}
        rispostaIl: {type: string, format: date-time, nullable: true}
    NearestProposal:
      type: object
      properties:
        autistaId: {type: integer, format: int64}
        autistaNome: {type: string}
        distanzaKm: {type: number, description: Linea d'aria dalla base al luogo del sinistro}
        stato: {type: string}
        scadenzaIl: {type: string, format: date-time}
        offertaId: {type: integer, format: int64}
    CentreAlert:
      type: object
      properties:
        id: {type: integer, format: int64}
        tipo: {type: string, enum: [RIFIUTO, SCADENZA, SUPPORTO]}
        missioneId: {type: integer, format: int64}
        codice: {type: string}
        autistaId: {type: integer, format: int64, nullable: true}
        autistaNome: {type: string, nullable: true}
        quando: {type: string, format: date-time}
        noteId: {type: integer, format: int64, nullable: true, description: 'Solo per SUPPORTO: serve a segnarla come gestita'}
        testo: {type: string, nullable: true, description: Solo per SUPPORTO}
    DriverMissionDetail:
      type: object
      properties:
        missione: {$ref: '#/components/schemas/Mission'}
        cliente:
          type: object
          properties:
            nome: {type: string, nullable: true}
            cognome: {type: string, nullable: true}
            telefono: {type: string, nullable: true}
            targa: {type: string, nullable: true, description: Solo dopo l'accettazione}
            modelloVeicolo: {type: string, nullable: true}
            telefonoSulPosto: {type: string, nullable: true}
        officina:
          type: object
          nullable: true
          properties:
            nome: {type: string}
            indirizzo: {type: string}
            citta: {type: string}
            lat: {type: number}
            lng: {type: number}
        guadagnoStimato: {type: number, nullable: true}
    ChatVehicleLookupResult:
      type: object
      properties:
        verificato: {type: boolean}
        clienteId: {type: integer, format: int64, nullable: true}
        clienteNome: {type: string, nullable: true}
        compagniaNome: {type: string, nullable: true}
        esito: {type: string, enum: [VERIFICATA, DA_VERIFICARE]}
    ChatStatusRequest:
      type: object
      required: [canale, destinatario]
      properties:
        canale:
          type: string
          enum: [telegram, whatsapp]
        destinatario: {type: string, maxLength: 120, description: Id della chat}
    ProviderWebhookPayload: {type: object, description: Payload raw del provider; schema provider-specific da definire in implementazione., additionalProperties: true}
    ChatVehicleLookup:
      type: object
      required: [sessionId, targa]
      properties:
        sessionId: {type: string, minLength: 16, maxLength: 64}
        targa: {type: string, minLength: 5, maxLength: 20}
    ChatMissionRequest:
      type: object
      description: Nuova pratica richiede un lookup della stessa sessione e targa negli ultimi 15 minuti e, con clienteId, polizza ancora valida. Retry della stessa richiesta
        conserva sessione, destinatario e payload; mismatch 409. Non prova titolarita del cliente. Con tipoProblema sono obbligatori targa e telefonoSulPosto, e tipoIntervento e descrizioneProblema
        sono ignorati. Senza tipoProblema vale il vecchio formato, accettato per compatibilità durante il merge, che richiede clienteId, tipoIntervento e descrizioneProblema.
      required: [origineIndirizzo, canaleOrigine, sessionId, requestId, destinatario]
      properties:
        clienteId: {type: integer, format: int64, minimum: 1, nullable: true, description: null se il lookup ha risposto DA_VERIFICARE}
        targa: {type: string, minLength: 5, maxLength: 20}
        telefonoSulPosto: {type: string, pattern: '^\+?[0-9][0-9 ]{5,19}$'}
        tipoProblema: {type: string, enum: [RUOTA_CON_SCORTA, RUOTA_SENZA_SCORTA, BATTERIA_SCARICA, GUASTO_MOTORE, INCIDENTE]}
        tipoIntervento:
          type: string
          enum: *id001
        descrizioneProblema: {type: string, minLength: 1, maxLength: 2000}
        origineIndirizzo: {type: string, minLength: 1, maxLength: 500}
        origineLat: {type: number, minimum: -90, maximum: 90, nullable: true}
        origineLng: {type: number, minimum: -180, maximum: 180, nullable: true}
        officinaId: {type: integer, format: int64, nullable: true, minimum: 1}
        canaleOrigine:
          type: string
          enum: [telegram, whatsapp]
        sessionId: {type: string, minLength: 16, maxLength: 64}
        requestId: {type: string, minLength: 16, maxLength: 64}
        destinatario: {type: string, minLength: 1, maxLength: 120}
    ChatNotification:
